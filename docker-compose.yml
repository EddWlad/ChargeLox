services:
  postgres:
    image: postgres:16
    container_name: chargelox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-chargelox}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - chargelox_pgdata:/var/lib/postgresql/data

volumes:
  chargelox_pgdata:

